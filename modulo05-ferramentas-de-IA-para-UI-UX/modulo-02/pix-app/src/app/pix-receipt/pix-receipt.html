<main class="receipt-container">
  <div class="receipt-card">
    <!-- Success Header -->
    <div class="receipt-header">
      <div class="success-icon">
        <span class="material-symbols-outlined check-icon">check_circle</span>
      </div>
      <h1 class="receipt-title">Agendamento confirmado</h1>
      <p class="receipt-amount">{{ valor() | currency:'BRL':'symbol':'1.2-2' }}</p>
      <div class="divider"></div>

      <!-- Transfer Details -->
      <div class="details-section">
        <div class="detail-row">
          <span class="detail-label">Destinatário</span>
          <span class="detail-value highlight">{{ nome() }}</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Chave Pix</span>
          <span class="detail-value block">{{ chave() }}</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Data do agendamento</span>
          <span class="detail-value block">{{ formatarData(dataAgendamento()) }}</span>
        </div>
      </div>
    </div>

    <!-- Action Buttons Grid -->
    <div class="actions-grid">
      <button class="action-btn">
        <span class="material-symbols-outlined action-icon">share</span>
        <span class="action-label">Compartilhar</span>
      </button>
      <button class="action-btn">
        <span class="material-symbols-outlined action-icon">file_download</span>
        <span class="action-label">Baixar PDF</span>
      </button>
      <button class="action-btn">
        <span class="material-symbols-outlined action-icon">print</span>
        <span class="action-label">Imprimir</span>
      </button>
    </div>

    <!-- Main Footer Button -->
    <div class="footer-actions">
      <button type="button" class="primary-btn" (click)="novoAgendamento.emit()">
        Fazer novo agendamento
      </button>
      <button type="button" class="secondary-btn" (click)="cancelar.emit()">
        Cancelar agendamento
      </button>
    </div>
  </div>
</main>
